<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>残業報告 2026</title>
  <meta name="description" content="2026年10月と11月の残業報告。計算した時間と、書いた時間を並べています。">
  <meta name="theme-color" content="#155e4a">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div>
        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="page-title"></h1>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="lang-ja" data-lang="ja">日本語</button>
        <button type="button" id="lang-en" data-lang="en">English</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <p class="lead" id="page-summary"></p>

    <section id="totals" class="section"></section>
    <section id="days" class="section"></section>
    <section id="differences" class="section"></section>
    <section id="rules" class="section"></section>
    <section id="proof" class="section"></section>
    <section id="add" class="section"></section>
  </main>

  <footer class="wrap foot" id="foot"></footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
